name: yishan-crm-cd-fc

"on":
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "apps/yishan-api/deploy/fc3/**"
      - "!apps/**/docs/**"
      - "!apps/**/*.md"
      - "!apps/**/README.md"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  schedule:
    # 每天 20:15 UTC (= 北京时间 04:15) 检查证书到期并按需续签。
    # 比 yishan-cert-rotate-fc（19:15 UTC）晚 1 小时，避免并发冲突。
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      force_renew_cert:
        description: Force certificate renewal
        required: false
        default: "false"

concurrency:
  group: yishan-crm-cd-fc
  cancel-in-progress: true

env:
  AIC_VERSION: '0.1.2-dev.2'
  NODE_VERSION: '22.22.1'

jobs:
  deploy-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: YISHAN_CRM
    env:
      FUNCTION_REGION: ${{ vars.CRM_FUNCTION_REGION }}
      FUNCTION_NAME: ${{ vars.CRM_FUNCTION_NAME }}
      FUNCTION_DESCRIPTION: ${{ vars.CRM_FUNCTION_DESCRIPTION }}
      FUNCTION_VPC_ID: ${{ vars.CRM_FUNCTION_VPC_ID }}
      FUNCTION_VSWITCH_ID: ${{ vars.CRM_FUNCTION_VSWITCH_ID }}
      FUNCTION_SECURITY_GROUP: ${{ vars.CRM_FUNCTION_SECURITY_GROUP }}
      CUSTOM_DOMAIN: ${{ vars.CRM_CUSTOM_DOMAIN }}
      CERT_NAME: ${{ vars.CRM_CERT_NAME }}
      DNS_PROFILE: ${{ vars.CRM_DNS_PROFILE || 'personal' }}
      RENEW_DAYS: ${{ vars.CRM_CERT_RENEW_DAYS || '30' }}
    steps:
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          : "${FUNCTION_REGION:?Missing CRM_FUNCTION_REGION}"
          : "${FUNCTION_NAME:?Missing CRM_FUNCTION_NAME}"
          : "${FUNCTION_DESCRIPTION:?Missing CRM_FUNCTION_DESCRIPTION}"
          : "${FUNCTION_VPC_ID:?Missing CRM_FUNCTION_VPC_ID}"
          : "${FUNCTION_VSWITCH_ID:?Missing CRM_FUNCTION_VSWITCH_ID}"
          : "${FUNCTION_SECURITY_GROUP:?Missing CRM_FUNCTION_SECURITY_GROUP}"
          : "${CUSTOM_DOMAIN:?Missing CRM_CUSTOM_DOMAIN}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # ── 1. 证书处理：自己管自己的域名和证书 ────────────────────────────────
      - name: Setup aic config
        env:
          AIC_CONFIG: ${{ secrets.CRM_AIC_CONFIG }}
        run: |
          mkdir -p ~/.config/aic
          printf '%s\n' "$AIC_CONFIG" > ~/.config/aic/config.toml

      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=admin@iximei.cn

      - name: Install aic CLI
        run: |
          npm install -g @zerocmf/aic@${{ env.AIC_VERSION }}

      - name: Install Aliyun CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/install.sh | sudo bash

      - name: Configure Aliyun CLI (DNS profile)
        run: |
          node /home/ubuntu/workspace/cert-auto/scripts/configure-aliyun-cli-from-aic.mjs ${{ env.DNS_PROFILE }} ${{ env.FUNCTION_REGION }}

      - name: Verify aic installation
        run: aic --version

      - name: Check certificate expiry
        id: cert_check
        run: |
          echo "Checking certificate for: ${{ env.CUSTOM_DOMAIN }}"
          cert_end_date=$(echo | openssl s_client -connect "${{ env.CUSTOM_DOMAIN }}:443" -servername "${{ env.CUSTOM_DOMAIN }}" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2- || true)
          if [ -n "$cert_end_date" ]; then
            cert_end_epoch=$(date -d "$cert_end_date" +%s)
            now_epoch=$(date +%s)
            days_left=$(( (cert_end_epoch - now_epoch) / 86400 ))
            echo "days_left=$days_left" >> "$GITHUB_OUTPUT"
            echo "Certificate expires in ${days_left} day(s): $cert_end_date"
          else
            echo "days_left=0" >> "$GITHUB_OUTPUT"
            echo "No existing certificate found, will issue new one"
          fi

      - name: Issue certificate (DNS-01)
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        run: |
          echo "Certificate needs renewal (days_left: ${{ steps.cert_check.outputs.days_left }}, threshold: ${{ env.RENEW_DAYS }})"
          aic cert:issue "${{ env.CUSTOM_DOMAIN }}" -d aliyun -p ${{ env.DNS_PROFILE }}

      - name: Upload certificate to CAS
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        id: cas_upload
        run: |
          # 从 acme.sh 证书目录读取最新证书
          CERT_DIR="$HOME/.acme.sh/${{ env.CUSTOM_DOMAIN }}"
          FULLCHAIN="$CERT_DIR/fullchain.cer"
          PRIVATE_KEY="$CERT_DIR/${{ env.CUSTOM_DOMAIN }}.key"
          if [ ! -f "$FULLCHAIN" ] || [ ! -f "$PRIVATE_KEY" ]; then
            echo "Error: Certificate files not found in $CERT_DIR"
            exit 1
          fi
          echo "Uploading certificate to CAS..."
          CERT_NAME="${{ env.CERT_NAME }}-$(date +%Y%m%d)"
          upload_result=$(aic aliyun-cert:upload "$CERT_NAME" "$FULLCHAIN" "$PRIVATE_KEY" -p ${{ env.DNS_PROFILE }})
          echo "$upload_result"
          CERT_ID=$(echo "$upload_result" | jq -r '.certId // empty')
          if [ -z "$CERT_ID" ] || [ "$CERT_ID" == "null" ]; then
            echo "Error: Failed to upload certificate to CAS"
            exit 1
          fi
          echo "cert_id=$CERT_ID" >> "$GITHUB_OUTPUT"
          echo "Certificate uploaded with ID: $CERT_ID"

      - name: Deploy domain with renewed cert (CAS reference)
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        env:
          CERT_ID: ${{ steps.cas_upload.outputs.cert_id }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_ID:-}" ]; then
            echo "No certificate ID, skip domain deploy"
            exit 0
          fi
          # CAS 引用必须带 cret- 前缀
          export CAS_CERT_NAME="cret-${CERT_ID}"
          echo "Deploying FC custom domain ${{ env.CUSTOM_DOMAIN }} with certName: $CAS_CERT_NAME"
          # 先把 s cli 凭据准备好
          ACCOUNT_ID_CLEAN="$(echo "${ALIBABA_CLOUD_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          if [ -n "${ACCOUNT_ID_CLEAN}" ] && echo "${ACCOUNT_ID_CLEAN}" | grep -Eq '^[0-9]{16,32}$'; then
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              --AccountID "$ACCOUNT_ID_CLEAN" \
              -a enterprise \
              -f
          else
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              -a enterprise \
              -f
          fi
          # s deploy fc3-domain 组件是幂等的：首次 CreateCustomDomain，后续 UpdateCustomDomain。
          # certName 走 ${env(CAS_CERT_NAME)} 注入到 domain.yaml 模板。
          cd "$GITHUB_WORKSPACE/apps/yishan-api"
          export CUSTOM_DOMAIN="${{ env.CUSTOM_DOMAIN }}"
          export FUNCTION_REGION="${{ env.FUNCTION_REGION }}"
          export FUNCTION_NAME="${{ env.FUNCTION_NAME }}"
          s deploy -y -t deploy/fc3/templates/domain.yaml -a enterprise

      - name: Verify cert after deploy
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        run: |
          set -euo pipefail
          cert_start_line="$(openssl s_client -servername "${{ env.CUSTOM_DOMAIN }}" -connect "${{ env.CUSTOM_DOMAIN }}:443" < /dev/null 2>/dev/null | openssl x509 -noout -startdate)"
          cert_end_line="$(openssl s_client -servername "${{ env.CUSTOM_DOMAIN }}" -connect "${{ env.CUSTOM_DOMAIN }}:443" < /dev/null 2>/dev/null | openssl x509 -noout -enddate)"
          echo "Post-deploy cert start: ${cert_start_line#notBefore=}"
          echo "Post-deploy cert end: ${cert_end_line#notAfter=}"
          {
            echo "### Certificate After Deploy"
            echo "- Domain: ${{ env.CUSTOM_DOMAIN }}"
            echo "- notBefore: ${cert_start_line#notBefore=}"
            echo "- notAfter: ${cert_end_line#notAfter=}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 2. 应用部署 ───────────────────────────────────────────────────────
      - name: Prepare yishan-tiptap
        working-directory: apps/yishan-components/yishan-tiptap
        run: |
          pnpm install --filter yishan-tiptap --no-frozen-lockfile
          pnpm build --filter yishan-tiptap

      - name: Generate Admin plugin routes
        run: pnpm --filter yishan-admin exec max setup

      - name: Build yishan-admin
        env:
          PUBLIC_PATH: ${{ vars.CRM_ADMIN_BASE_PATH || '/admin/' }}
        run: pnpm --filter yishan-admin build

      - name: Prepare .env
        working-directory: apps/yishan-api
        env:
          LOG_LEVEL: info
          DATABASE_USER: ${{ secrets.YISHAN_CRM_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.YISHAN_CRM_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.YISHAN_CRM_DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.YISHAN_CRM_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.YISHAN_CRM_DATABASE_PORT }}
          REDIS_URL: ${{ secrets.YISHAN_CRM_REDIS_URL }}
          REDIS_HOST: ${{ vars.CRM_REDIS_HOST }}
        run: |
          set -euo pipefail
          ENV_FILE="$(pwd)/.env"
          node <<'NODE' > "$ENV_FILE"
          const redisUrl = process.env.REDIS_URL || '';
          let redisPort = '6379';
          let redisHost = process.env.REDIS_HOST || '';
          let redisPassword = '';
          let redisDb = '0';
          if (redisUrl) {
            const parsed = new URL(redisUrl);
            redisHost = redisHost || parsed.hostname;
            redisPort = parsed.port || redisPort;
            redisPassword = decodeURIComponent(parsed.password || '');
            redisDb = (parsed.pathname || '/0').replace(/^\//, '') || redisDb;
          }
          const lines = [
            `LOG_LEVEL=${process.env.LOG_LEVEL || 'info'}`,
            `DATABASE_USER=${process.env.DATABASE_USER || ''}`,
            `DATABASE_PASSWORD=${process.env.DATABASE_PASSWORD || ''}`,
            `DATABASE_NAME=${process.env.DATABASE_NAME || ''}`,
            `DATABASE_HOST=${process.env.DATABASE_HOST || ''}`,
            `DATABASE_PORT=${process.env.DATABASE_PORT || '3306'}`,
            `REDIS_URL=${redisUrl}`,
            `REDIS_HOST=${redisHost}`,
            `REDIS_PORT=${redisPort}`,
            `REDIS_PASSWORD=${redisPassword}`,
            `REDIS_DB=${redisDb}`,
          ];
          process.stdout.write(lines.join('\n') + '\n');
          NODE

      - name: Install Serverless Devs
        run: npm i -g @serverless-devs/s

      - name: Configure Serverless Devs Access
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          if [ -z "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}" ]; then
            echo "Missing secret: ALIBABA_CLOUD_ACCESS_KEY_ID"
            exit 1
          fi
          if [ -z "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}" ]; then
            echo "Missing secret: ALIBABA_CLOUD_ACCESS_KEY_SECRET"
            exit 1
          fi
          ACCOUNT_ID_CLEAN="$(echo "${ALIBABA_CLOUD_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          if [ -n "${ACCOUNT_ID_CLEAN}" ] && echo "${ACCOUNT_ID_CLEAN}" | grep -Eq '^[0-9]{16,32}$'; then
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              --AccountID "$ACCOUNT_ID_CLEAN" \
              -a enterprise \
              -f
          else
            echo "ALIBABA_CLOUD_ACCOUNT_ID missing or invalid, try non-AccountID mode"
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              -a enterprise \
              -f
          fi

      - name: Restore layer lock
        uses: actions/cache@v4
        with:
          path: apps/yishan-api/deploy/fc3/layer-lock.json
          key: yishan-api-layer-lock-crm
          restore-keys: |
            yishan-api-layer-lock-crm

      - name: Build runtime layer
        working-directory: apps/yishan-api
        run: bash ./deploy/fc3/scripts/build-runtime-layer.sh

      - name: Publish runtime layer if needed
        id: publish_layer
        working-directory: apps/yishan-api
        env:
          YISHAN_FC_REGION: ${{ vars.CRM_FUNCTION_REGION || 'cn-shanghai' }}
          YISHAN_FC_LAYER_NAME: ${{ vars.CRM_FC_LAYER_NAME || 'yishan-api-runtime-layer-crm' }}
          YISHAN_FC_ACCESS_ALIAS: enterprise
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash ./deploy/fc3/scripts/publish-runtime-layer.sh | tee /tmp/publish_layer.log
          LAYER_ARN="$(grep -E '^YISHAN_API_RUNTIME_LAYER_ARN=' /tmp/publish_layer.log | tail -n1 | cut -d= -f2-)"
          if [ -z "$LAYER_ARN" ]; then
            echo "Unable to extract runtime layer ARN" >&2
            exit 1
          fi
          echo "layer_arn=$LAYER_ARN" >> "$GITHUB_OUTPUT"

      - name: Save layer lock
        if: always() && hashFiles('apps/yishan-api/deploy/fc3/layer-lock.json') != ''
        uses: actions/cache@v4
        with:
          path: apps/yishan-api/deploy/fc3/layer-lock.json
          key: yishan-api-layer-lock-crm

      - name: Build Layered Package
        working-directory: apps/yishan-api
        run: bash ./deploy/fc3/scripts/pre-deploy-layered.sh

      - name: Deploy layered function
        working-directory: apps/yishan-api
        env:
          LOG_LEVEL: info
          DATABASE_USER: ${{ secrets.YISHAN_CRM_DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.YISHAN_CRM_DATABASE_PASSWORD }}
          DATABASE_NAME: ${{ secrets.YISHAN_CRM_DATABASE_NAME }}
          DATABASE_HOST: ${{ secrets.YISHAN_CRM_DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.YISHAN_CRM_DATABASE_PORT }}
          REDIS_URL: ${{ secrets.YISHAN_CRM_REDIS_URL }}
          REDIS_HOST: ${{ vars.CRM_REDIS_HOST }}
          JWT_SECRET: ${{ secrets.YISHAN_CRM_JWT_SECRET }}
          YISHAN_API_RUNTIME_LAYER_ARN: ${{ steps.publish_layer.outputs.layer_arn }}
          FUNCTION_REGION: ${{ vars.CRM_FUNCTION_REGION }}
          FUNCTION_NAME: ${{ vars.CRM_FUNCTION_NAME }}
          FUNCTION_DESCRIPTION: ${{ vars.CRM_FUNCTION_DESCRIPTION }}
          FUNCTION_VPC_ID: ${{ vars.CRM_FUNCTION_VPC_ID }}
          FUNCTION_VSWITCH_ID: ${{ vars.CRM_FUNCTION_VSWITCH_ID }}
          FUNCTION_SECURITY_GROUP: ${{ vars.CRM_FUNCTION_SECURITY_GROUP }}
          ADMIN_BASE_PATH: ${{ vars.CRM_ADMIN_BASE_PATH || '/admin/' }}
          ADMIN_REDIRECT_ROOT: ${{ vars.CRM_ADMIN_REDIRECT_ROOT || 'true' }}
        run: |
          set -euo pipefail
          export DATABASE_PORT="${DATABASE_PORT:-3306}"
          node <<'NODE' > /tmp/yishan_layered_env.sh
          const redisUrl = process.env.REDIS_URL || '';
          let redisPort = '6379';
          let redisHost = process.env.REDIS_HOST || '';
          let redisPassword = '';
          let redisDb = '0';
          if (redisUrl) {
            const parsed = new URL(redisUrl);
            redisHost = redisHost || parsed.hostname;
            redisPort = parsed.port || redisPort;
            redisPassword = decodeURIComponent(parsed.password || '');
            redisDb = (parsed.pathname || '/0').replace(/^\//, '') || redisDb;
          }
          const entries = {
            LOG_LEVEL: process.env.LOG_LEVEL || 'info',
            DATABASE_USER: process.env.DATABASE_USER || '',
            DATABASE_PASSWORD: process.env.DATABASE_PASSWORD || '',
            DATABASE_NAME: process.env.DATABASE_NAME || '',
            DATABASE_HOST: process.env.DATABASE_HOST || '',
            DATABASE_PORT: process.env.DATABASE_PORT || '3306',
            JWT_SECRET: process.env.JWT_SECRET || '',
            REDIS_PORT: redisPort,
            REDIS_HOST: redisHost,
            REDIS_PASSWORD: redisPassword,
            REDIS_DB: redisDb,
          };
          for (const [key, value] of Object.entries(entries)) {
            console.log(`export ${key}=${JSON.stringify(value)}`);
          }
          NODE
          . /tmp/yishan_layered_env.sh
          bash ./deploy/fc3/scripts/deploy-layered-function.sh

      - name: Notify on failure (WeChat)
        if: failure()
        env:
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}
        run: |
          if [ -z "$WECHAT_OPENID" ]; then
            echo "WECHAT_OPENID is empty, skip notification"
            exit 0
          fi
          npm install -g @zerocmf/aic@latest
          aic notify:send "$WECHAT_OPENID" \
            "CRM 部署失败" \
            "仓库: ${{ github.repository }} 运行: ${{ github.run_id }}" \
            -u "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -t "部署告警" \
            -r "请尽快处理并重试"
