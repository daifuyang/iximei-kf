name: yishan-crm-cd-fc

"on":
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "apps/yishan-api/deploy/fc3/**"
      - "!apps/**/docs/**"
      - "!apps/**/*.md"
      - "!apps/**/README.md"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  schedule:
    # 每天 20:15 UTC (= 北京时间 04:15) 检查证书到期并按需续签。
    # 比 yishan-cert-rotate-fc（19:15 UTC）晚 1 小时，避免并发冲突。
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      force_renew_cert:
        description: Force certificate renewal
        required: false
        default: "false"

concurrency:
  group: yishan-crm-cd-fc
  cancel-in-progress: true

env:
  AIC_VERSION: '0.1.2-dev.2'
  NODE_VERSION: '22.22.1'

jobs:
  deploy-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: YISHAN_API
    env:
      FUNCTION_REGION: ${{ vars.FUNCTION_REGION }}
      FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      CERT_NAME: ${{ vars.CERT_NAME }}
      # 与 yishan-cert-rotate-fc 对齐：DNS_PROFILE/RENEW_DAYS 不暴露成 vars，
      # 硬编码 default profile (personal) + 30 天阈值。如果未来要 per-domain
      # 再加 vars.CERT_RENEW_DAYS 等。
      DNS_PROFILE: default
      RENEW_DAYS: '30'
    steps:
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          : "${FUNCTION_REGION:?Missing FUNCTION_REGION}"
          : "${FUNCTION_NAME:?Missing FUNCTION_NAME}"
          : "${CUSTOM_DOMAIN:?Missing CUSTOM_DOMAIN}"
          : "${CERT_NAME:?Missing CERT_NAME}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@8.15.9 --activate

      # ── 1. 证书处理：自己管自己的域名和证书 ────────────────────────────────
      - name: Setup aic config
        env:
          AIC_CONFIG: ${{ secrets.CRM_AIC_CONFIG }}
        run: |
          mkdir -p ~/.config/aic
          printf '%s\n' "$AIC_CONFIG" > ~/.config/aic/config.toml

      - name: Install acme.sh
        run: |
          curl https://get.acme.sh | sh -s email=admin@iximei.cn

      - name: Install aic CLI
        run: |
          npm install -g @zerocmf/aic@${{ env.AIC_VERSION }}

      - name: Install Aliyun CLI
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/install.sh | sudo bash

      - name: Verify aic installation
        run: aic --version

      - name: Check certificate expiry
        id: cert_check
        run: |
          echo "Checking certificate for: ${{ env.CUSTOM_DOMAIN }}"
          cert_end_date=$(echo | openssl s_client -connect "${{ env.CUSTOM_DOMAIN }}:443" -servername "${{ env.CUSTOM_DOMAIN }}" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null \
            | cut -d= -f2- || true)
          if [ -n "$cert_end_date" ]; then
            cert_end_epoch=$(date -d "$cert_end_date" +%s)
            now_epoch=$(date +%s)
            days_left=$(( (cert_end_epoch - now_epoch) / 86400 ))
            echo "days_left=$days_left" >> "$GITHUB_OUTPUT"
            echo "Certificate expires in ${days_left} day(s): $cert_end_date"
          else
            echo "days_left=0" >> "$GITHUB_OUTPUT"
            echo "No existing certificate found, will issue new one"
          fi

      - name: Issue certificate (DNS-01)
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        run: |
          echo "Certificate needs renewal (days_left: ${{ steps.cert_check.outputs.days_left }}, threshold: ${{ env.RENEW_DAYS }})"
          aic cert:issue "${{ env.CUSTOM_DOMAIN }}" -d aliyun -p ${{ env.DNS_PROFILE }}

      - name: Upload certificate to CAS
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        id: cas_upload
        run: |
          # 从 acme.sh 证书目录读取最新证书
          CERT_DIR="$HOME/.acme.sh/${{ env.CUSTOM_DOMAIN }}"
          FULLCHAIN="$CERT_DIR/fullchain.cer"
          PRIVATE_KEY="$CERT_DIR/${{ env.CUSTOM_DOMAIN }}.key"
          if [ ! -f "$FULLCHAIN" ] || [ ! -f "$PRIVATE_KEY" ]; then
            echo "Error: Certificate files not found in $CERT_DIR"
            exit 1
          fi
          echo "Uploading certificate to CAS..."
          CERT_NAME="${{ env.CERT_NAME }}-$(date +%Y%m%d)"
          # CAS 上传需要 enterprise profile（FC/CAS 权限），不能用 DNS_PROFILE（personal）
          upload_result=$(aic aliyun-cert:upload "$CERT_NAME" "$FULLCHAIN" "$PRIVATE_KEY" -p enterprise)
          echo "$upload_result"
          CERT_ID=$(echo "$upload_result" | jq -r '.certId // empty')
          if [ -z "$CERT_ID" ] || [ "$CERT_ID" == "null" ]; then
            echo "Error: Failed to upload certificate to CAS"
            exit 1
          fi
          echo "cert_id=$CERT_ID" >> "$GITHUB_OUTPUT"
          echo "Certificate uploaded with ID: $CERT_ID"

      - name: Deploy domain with renewed cert (CAS reference)
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        env:
          CERT_ID: ${{ steps.cas_upload.outputs.cert_id }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_ID:-}" ]; then
            echo "No certificate ID, skip domain deploy"
            exit 0
          fi
          # CAS 引用必须带 cret- 前缀
          export CAS_CERT_NAME="cret-${CERT_ID}"
          echo "Deploying FC custom domain ${{ env.CUSTOM_DOMAIN }} with certName: $CAS_CERT_NAME"
          # 先把 s cli 凭据准备好
          ACCOUNT_ID_CLEAN="$(echo "${ALIBABA_CLOUD_ACCOUNT_ID:-}" | tr -d '[:space:]')"
          if [ -n "${ACCOUNT_ID_CLEAN}" ] && echo "${ACCOUNT_ID_CLEAN}" | grep -Eq '^[0-9]{16,32}$'; then
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              --AccountID "$ACCOUNT_ID_CLEAN" \
              -a enterprise \
              -f
          else
            s config add \
              --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
              --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
              -a enterprise \
              -f
          fi
          # s deploy fc3-domain 组件是幂等的：首次 CreateCustomDomain，后续 UpdateCustomDomain。
          # certName 走 ${env(CAS_CERT_NAME)} 注入到 domain.yaml 模板。
          cd "$GITHUB_WORKSPACE/apps/yishan-api"
          export CUSTOM_DOMAIN="${{ env.CUSTOM_DOMAIN }}"
          export FUNCTION_REGION="${{ env.FUNCTION_REGION }}"
          export FUNCTION_NAME="${{ env.FUNCTION_NAME }}"
          s deploy -y -t deploy/fc3/templates/domain.yaml -a enterprise

      - name: Verify cert after deploy
        if: github.event.inputs.force_renew_cert == 'true' || steps.cert_check.outputs.days_left == '0' || steps.cert_check.outputs.days_left < env.RENEW_DAYS
        run: |
          set -euo pipefail
          cert_start_line="$(openssl s_client -servername "${{ env.CUSTOM_DOMAIN }}" -connect "${{ env.CUSTOM_DOMAIN }}:443" < /dev/null 2>/dev/null | openssl x509 -noout -startdate)"
          cert_end_line="$(openssl s_client -servername "${{ env.CUSTOM_DOMAIN }}" -connect "${{ env.CUSTOM_DOMAIN }}:443" < /dev/null 2>/dev/null | openssl x509 -noout -enddate)"
          echo "Post-deploy cert start: ${cert_start_line#notBefore=}"
          echo "Post-deploy cert end: ${cert_end_line#notAfter=}"
          {
            echo "### Certificate After Deploy"
            echo "- Domain: ${{ env.CUSTOM_DOMAIN }}"
            echo "- notBefore: ${cert_start_line#notBefore=}"
            echo "- notAfter: ${cert_end_line#notAfter=}"
          } >> "$GITHUB_STEP_SUMMARY"
