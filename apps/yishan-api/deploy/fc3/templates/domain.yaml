edition: 3.0.0
name: yishan-domain
access: enterprise
vars:
  region: ${env(FUNCTION_REGION)}
  functionName: ${env(FUNCTION_NAME)}
  domainName: ${env(CUSTOM_DOMAIN)}
resources:
  yishan_domain:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: ${vars.domainName}
      protocol: HTTPS
      certConfig:
        # CRM CD 走 aic + CAS：先 aic aliyun-cert:upload 上传证书拿到 certId，
        # 再 export CAS_CERT_NAME=cret-${CERT_ID}，由 s deploy 把域名绑定/更新
        # 一起做（首次 CreateCustomDomain，后续 UpdateCustomDomain 幂等）。
        # certName 必须带 cret- 前缀才能引用 CAS 证书。
        certName: ${env(CAS_CERT_NAME)}
      routeConfig:
        routes:
          - path: /
            functionName: ${vars.functionName}
            methods:
              - GET
              - HEAD
          - path: /*
            functionName: ${vars.functionName}
